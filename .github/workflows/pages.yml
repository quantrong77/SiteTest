name: Triển khai GitHub Pages

on:
  push:
    branches: [main, codex/shadcn-ui-refactor]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    if: >-
      ${{ always() && (
        needs.test.result == 'success' ||
        github.ref == 'refs/heads/codex/shadcn-ui-refactor' ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/bbtn-pdf-import-review')
      ) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Create js/config.js
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          printf "window.SUPABASE_CONFIG = { url: '%s', key: '%s' };\n" "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > js/config.js

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
