name: Triển khai GitHub Pages

# Chỉ triển khai từ main (sau khi test đạt). Nhánh hiệu chỉnh thử trên localhost (npm run dev / npm run build), không deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  # Build và deploy tách 2 job (mẫu chuẩn của GitHub Pages): deploy-pages chạy cùng job với upload-pages-artifact
  # từng báo "No artifacts named github-pages" do gói vừa tải lên chưa kịp đăng ký.
  build:
    needs: test
    # chạy tay (workflow_dispatch) trên nhánh khác: chỉ chạy test, không triển khai
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Create js/config.js
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          printf "window.SUPABASE_CONFIG = { url: '%s', key: '%s' };\n" "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > js/config.js

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # chờ gói github-pages đăng ký xong rồi mới triển khai
      - run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
