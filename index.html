<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BBTN MBA – Nhập liệu hiện trường</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="12" r="5.6" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="15" cy="12" r="5.6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span>
      <div>
        <div class="brand-title">BBTN Máy biến áp</div>
        <div class="brand-sub">Nhập liệu thí nghiệm hiện trường · so sánh xuất xưởng · QĐ 1901/QĐ-EVNNPT</div>
      </div>
    </div>
    <div class="record" id="recordChip"></div>
    <div class="actions">
      <button class="btn ghost" data-act="new" title="Tạo biên bản mới từ template">Mới</button>
      <button class="btn ghost" data-act="open" title="Mở file dữ liệu .json đã lưu">Mở…</button>
      <button class="btn ghost" data-act="save" title="Lưu dữ liệu ra file .json">Lưu .json</button>
      <button class="btn ghost" data-act="dbSave" title="Lưu biên bản lên CSDL Supabase">Lưu CSDL</button>
      <span class="sep"></span>
      <button class="btn" data-act="xlsx" title="Xuất bảng so sánh – đánh giá (.xlsx)">Xuất so sánh .xlsx</button>
      <button class="btn primary" data-act="docx" title="Điền dữ liệu vào template và tải BBTN (.docx)">Xuất BBTN .docx</button>
    </div>
    <div class="account" id="account"></div>
    <div class="netbar" id="netbar" aria-hidden="true"></div>
  </header>
  <div class="layout">
    <nav class="sidenav" id="nav" aria-label="Hạng mục">
      <div class="sld"><span class="bus" aria-hidden="true"></span><div id="navItems"></div></div>
    </nav>
    <main id="main" tabindex="-1"></main>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <dialog class="auth-dialog" id="authDialog" aria-labelledby="adTitle">
    <div class="ad-band"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="12" r="5.6" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="15" cy="12" r="5.6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span><span>BBTN Máy biến áp</span>
      <button class="ad-x" data-auth="close" aria-label="Đóng">×</button></div>
    <div id="adPanel"></div>
  </dialog>
  <input type="file" id="fileJson" accept=".json,application/json" hidden>
  <input type="file" id="fileXlsx" accept=".xlsx,.xlsm" hidden>
  <input type="file" id="fileDocx" accept=".docx" hidden>
  <input type="file" id="fileHitachi" accept=".xlsx,.xlsm" hidden>

  <script src="js/vendor/jszip.min.js"></script>
  <script src="js/vendor/xlsx.full.min.js"></script>
  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/embedded.js"></script>
  <script src="js/qd1901.js"></script>
  <script src="js/factory.js"></script>
  <script src="js/bushing-hitachi.js"></script>
  <script src="js/schema.js"></script>
  <script src="js/evaluate.js"></script>
  <script src="js/docx.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth-ui.js"></script>
  <script src="js/db-ui.js"></script>
  <script src="js/catalog-ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
