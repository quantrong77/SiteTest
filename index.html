<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site Test Report - Biên bản thí nghiệm MBA</title>
  <meta name="theme-color" content="#1663a6">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
</head>
<body>
  <div id="app-root"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <dialog class="auth-dialog" id="authDialog" aria-labelledby="adTitle">
    <div class="ad-band"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="12" r="5.6" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="15" cy="12" r="5.6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span><span>Site Test Report</span>
      <button class="ad-x" data-auth="close" aria-label="Đóng">×</button></div>
    <div id="adPanel"></div>
  </dialog>
  <dialog class="auth-dialog cpc-dialog" id="cpcDialog" aria-labelledby="cpcTitle">
    <div class="ad-band"><span>Đặc tính từ hóa TI chân sứ — CPC 100</span>
      <button class="ad-x" onclick="this.closest('dialog').close()" aria-label="Đóng">×</button></div>
    <div id="cpcPanel"></div>
  </dialog>
  <dialog class="auth-dialog cpc-dialog mrct-dialog" id="mrctDialog" aria-labelledby="mrctTitle">
    <div class="ad-band"><span>TI chân sứ — Megger MRCT</span>
      <button class="ad-x" onclick="this.closest('dialog').close()" aria-label="Đóng">×</button></div>
    <div id="mrctPanel"></div>
  </dialog>
  <dialog class="auth-dialog cpc-dialog wa-dialog" id="waDialog" aria-labelledby="waTitle">
    <div class="ad-band"><span>Nhập số liệu máy đo Haefely 2293</span>
      <button class="ad-x" onclick="this.closest('dialog').close()" aria-label="Đóng">×</button></div>
    <div id="waPanel"></div>
  </dialog>
  <input type="file" id="fileJson" accept=".json,application/json" hidden>
  <input type="file" id="fileXlsx" accept=".xlsx,.xlsm" hidden>
  <input type="file" id="fileDocx" accept=".docx" hidden>
  <input type="file" id="fileHitachi" accept=".xlsx,.xlsm" hidden>
  <input type="file" id="fileCpc" accept=".xml" multiple hidden>
  <input type="file" id="fileMrct" accept=".pdbxml,.pdf" multiple hidden>
  <input type="file" id="fileFra" accept=".docx" hidden>
  <input type="file" id="fileOil" accept=".docx" multiple hidden>
  <input type="file" id="fileNameplate" accept="image/*" hidden>
  <input type="file" id="file2293" accept=".csv,.bin" multiple hidden>
  <input type="file" id="fileDirana" accept=".csv,text/csv" multiple hidden>
  <input type="file" id="fileImpDocx" accept=".docx,.pdf,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" multiple hidden>
  <input type="file" id="dirImpDocx" webkitdirectory accept=".docx,.pdf" multiple hidden>
  <input type="file" id="diranaFolder" accept=".csv,text/csv" webkitdirectory multiple hidden>
  <input type="file" id="fileDiranaW" accept=".xlsx,.csv,text/csv" multiple hidden>
  <input type="file" id="diranaWFolder" accept=".xlsx,.csv,text/csv" webkitdirectory multiple hidden>

  <!-- Nghiệp vụ (hàm thuần): hàm chung, bảng tra QĐ 1901, quy đổi sứ, đăng ký loại thiết bị, mô-đun MBA -->
  <!-- Dữ liệu và tích hợp: .docx, Supabase, bảng hệ số K từ CSDL, bộ đọc máy đo -->
  <!-- Giao diện -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
